# Pile locale KalmQA : Ytosign + sa supervision, sur ton poste.
#
# À lancer depuis ce dossier (deploy/) :
#   cp .env.example .env        # puis choisis le mot de passe Grafana
#   docker compose -f compose.local.yaml up -d
#
# Tout est lié à 127.0.0.1 : rien n'est exposé sur ton réseau.
#   Ytosign     http://localhost:3000
#   Grafana     http://localhost:3001
#   Prometheus  http://localhost:9090
#   Alertmanager  http://localhost:9093
#
# Versions ÉPINGLÉES, jamais `latest` : une montée de version doit être un commit
# qu'on relit, pas une surprise un matin.

services:
  # L'application sous test, dans l'image que sa CI a construite, démarrée puis
  # publiée : la même qu'en production. Son code vit dans un dépôt à part.
  ytosign:
    # Publiée pour linux/amd64 et linux/arm64 : Docker prend celle de ta machine.
    image: ghcr.io/xyqotech/ytosign:sha-da8252c
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:3000
      DATA_DIR: /data
      DEFAULT_LOCALE: fr
      ALLOW_SIGNUP: "true"
      # « file » : les e-mails sont écrits dans /data/outbox, aucun serveur SMTP requis.
      MAIL_TRANSPORT: file
      # Les enregistrements vivent dans Postgres (service « db » ci-dessous) ;
      # les documents, le sceau et la clé d'instance restent sur le volume /data.
      # Le rôle et la base gardent le premier nom de l'application (« signsen »), comme les
      # volumes plus bas : les renommer ferait démarrer la pile sur des données vides.
      DATABASE_URL: postgres://signsen:${POSTGRES_PASSWORD}@db:5432/signsen
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - signsen-data:/data

  # La base de Ytosign. Version épinglée : changer de version majeure demande une
  # sauvegarde et une restauration, jamais un simple changement d'étiquette.
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: signsen
      POSTGRES_DB: signsen
      # Vient de .env, sans valeur de repli : un mot de passe vide est refusé par l'image.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mot de passe du compte de supervision, créé par postgres/init (voir ce script).
      MONITORING_PASSWORD: ${POSTGRES_MONITORING_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signsen -d signsen"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      # Les images Postgres 18 rangent leurs données sous /var/lib/postgresql/<majeure>.
      - signsen-db:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # La base vue de l'intérieur : l'exportateur traduit les statistiques de Postgres
  # en mesures pour Prometheus. Il se connecte avec le compte « monitoring », qui
  # lit les statistiques mais pas les données de Ytosign.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/signsen?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_MONITORING_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # La sonde : elle visite Ytosign comme le ferait un utilisateur et dit
  # « ça répond / ça ne répond pas », en combien de temps, avec quel code HTTP.
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  # La mémoire : Prometheus interroge la sonde toutes les 15 s et garde l'historique.
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox
      - alertmanager

  # Celui qui prévient. Prometheus lui remet les alertes qui se déclenchent. Ici,
  # aucun e-mail ne part : on les lit dans son interface, http://localhost:9093.
  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/demarrer.sh"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../monitoring/alertmanager/demarrer.sh:/etc/alertmanager/demarrer.sh:ro

  # La machine vue de l'intérieur : disque, mémoire. Sur ton poste, c'est la petite
  # machine virtuelle de Docker qu'il mesure.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped

  # Les graphes. Source de données et tableau de bord sont chargés depuis le dépôt
  # (monitoring/grafana) : rien n'est cliqué à la main, tout est rejouable.
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Vient de .env. Vide, Grafana garde son mot de passe par défaut : choisis-en un.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Lecture seule sans connexion : confortable en local, à ne PAS reprendre en production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  signsen-data:
  signsen-db:
  prometheus-data:
  grafana-data:
