# Alertes sur la base de Ytosign. Comme pour ytosign.yml, sans Alertmanager elles
# ne notifient personne : on les lit dans Prometheus, onglet « Alerts ».

groups:
  - name: postgres
    rules:
      # L'exportateur répond, mais il n'arrive plus à joindre Postgres.
      - alert: PostgresInjoignable
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critique
        annotations:
          summary: "Postgres ne répond plus"
          description: "L'exportateur n'arrive plus à se connecter à la base depuis plus d'une minute."

      # Plus aucune mesure : c'est l'exportateur lui-même qui est tombé. On ne sait
      # alors plus rien de la base, ce qui mérite aussi une alerte.
      - alert: PostgresSansMesures
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: avertissement
        annotations:
          summary: "Plus de mesures de Postgres"
          description: "L'exportateur Postgres ne répond plus à Prometheus depuis 2 minutes."

      # Une base qui refuse les connexions est une panne : on prévient avant.
      - alert: PostgresConnexionsSaturees
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: avertissement
        annotations:
          summary: "Postgres approche de sa limite de connexions"
          description: "Plus de 80 % des connexions autorisées sont utilisées depuis 5 minutes."
