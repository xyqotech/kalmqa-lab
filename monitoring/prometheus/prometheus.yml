# Prometheus : qui interroger, à quel rythme, et quelles règles d'alerte évaluer.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml
  # Règles propres à un vrai serveur (les sauvegardes). Ce dossier n'est monté
  # qu'en production ; absent, il est simplement ignoré.
  - /etc/prometheus/rules-production/*.yml

# À qui remettre les alertes : Alertmanager les regroupe et envoie les e-mails.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus se surveille lui-même.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # La santé de la sonde elle-même.
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # Celui qui envoie les alertes est surveillé lui aussi.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # La machine : disque, mémoire, et l'heure de la dernière sauvegarde.
  - job_name: serveur
    static_configs:
      - targets: ["node-exporter:9100"]

  # La base vue de l'intérieur, par l'exportateur Postgres.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Ytosign vu de l'extérieur. Prometheus ne parle pas à Ytosign : il demande à la
  # sonde d'aller visiter l'URL (d'où le jeu de réécriture ci-dessous).
  - job_name: ytosign-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # /healthz ne répond 200 que si la base répond aussi ; /login reste
          # à 200 même base arrêtée, il masquerait la panne.
          - http://ytosign:3000/healthz
    relabel_configs:
      # 1. L'URL à visiter devient le paramètre ?target= de la sonde.
      - source_labels: [__address__]
        target_label: __param_target
      # 2. On garde cette URL comme étiquette « instance », lisible dans les graphes.
      - source_labels: [__param_target]
        target_label: instance
      # 3. L'adresse réellement interrogée est celle de la sonde.
      - target_label: __address__
        replacement: blackbox:9115
